# Differential fuzzing of the new path (-toolexec, node package): nightly.
#
# `make fuzz-newpath` (test/fuzz/run.py) builds the hand-written adversarial
# corpus (test/fuzz/corpus/, test/fuzz/repro/) and N programs generated by
# test/fuzz/gen.py with gc and through graalgo-tool, and compares stdout,
# normalized stderr and exit status. The seed walks with the date so every
# night covers new programs; a failure prints the seed (gen:<seed>) to
# reproduce with `make fuzz-newpath N=1 SEED=<seed> FUZZ_CORPUS=0`.
# Known divergences are test/fuzz/known.txt (each cites docs/dev/bugs.md).
#
# Too slow for per-push (~1 s a program).
name: fuzz-newpath
# A dispatch's title carries its inputs: ci_status.sh lets only a dispatch
# with the default inputs supersede a red scheduled run (a reduced-scope
# dispatch proves nothing about the full run); other events keep the
# default title.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('fuzz-newpath dispatch inputs: n={0}', inputs.n) || '' }}"

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      n:
        description: 'generated programs'
        default: '500'
  push:
    paths:
      - 'test/fuzz/**'
      - '.github/workflows/fuzz-newpath.yml'

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: Build
        run: make generate build

      - name: Fuzz (exit 1 = new divergence, 3 = infra)
        run: |
          seed=$(( $(date +%s) / 86400 * 1000 ))
          make fuzz-newpath N="${{ github.event.inputs.n || '500' }}" SEED="$seed" \
            FUZZ_ARGS="--keep $RUNNER_TEMP/fuzz-fail --report $RUNNER_TEMP/fuzz-report.tsv"

      - name: Upload failing programs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-newpath
          path: |
            ${{ runner.temp }}/fuzz-fail
            ${{ runner.temp }}/fuzz-report.tsv
          if-no-files-found: ignore
