# Layer 4 — fuzz soak (phases/phase3/PLAN.md §5, GG-0037): generative
# differential fuzzing + native testing.F differential fuzzing, overnight
# per release.
#
# Cadence: nightly (the overnight per-release soak) plus manual dispatch.
# Each run: seeded program generation + differential harness batches
# (run_soak.sh) and the native testing.F targets with differential replay
# (fuzz/run_fuzz_native.sh). Minimized divergences become permanent
# regressions per SPEC §5.4 (phases/phase3/fuzzing/findings/).
#
# The continuous adversarial track reserves the same interface:
# run_soak.sh --seeds A:B runs one bounded batch.
#
# TIME BUDGET (all minutes): the 360 min job timeout below is the
# GitHub-hosted ceiling — timeout-minutes cannot exceed it, so the soak
# cannot be stretched by raising the timeout. The soak must fit inside
# it alongside everything else in the job:
#   job setup ~10 + Layer 4a soak + Layer 4b ~25 + upload ~5
#   + soak batch-start margin 20 (run_soak.sh stops starting new batches
#   20 min before its deadline so the last batch + minimize finishes
#   inside the soak window instead of overrunning into Layer 4b)
#   = 60 min reserve  =>  max soak = 360 - 60 = 300 min = 5 h.
# The validation step below derives the max from the timeout and the
# reserve and fails fast on an out-of-budget `hours` input, so a future
# timeout/reserve change cannot silently resurrect the overrun.
name: fuzz-soak

on:
  schedule:
    # Nightly overnight soak: 01:00 UTC.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Soak duration in hours (max 5: the 6 h GitHub-hosted job ceiling minus the 60 min reserve for setup, Layer 4b, upload and the batch-start margin)'
        required: false
        default: '5'

jobs:
  fuzz-soak:
    runs-on: ubuntu-24.04
    # GitHub-hosted job ceiling (6 h). Do NOT raise: the platform kills
    # the job at 360 min regardless of this value.
    timeout-minutes: 360
    env:
      # Single source of truth for the budget above; see the validation
      # step for the derivation. Keep in sync with run_soak.sh's
      # SOAK_BATCH_MARGIN_SECONDS (20 min) and Layer 4b's ~25 min.
      JOB_TIMEOUT_MINUTES: 360
      SOAK_RESERVE_MINUTES: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: Validate soak hours against job timeout
        run: |
          max_hours=$(( (JOB_TIMEOUT_MINUTES - SOAK_RESERVE_MINUTES) / 60 ))
          hours="${{ inputs.hours || '5' }}"
          case "$hours" in
            ''|*[!0-9]*)
              echo "::error::hours must be a positive integer, got '$hours'"
              exit 1 ;;
          esac
          if [ "$hours" -lt 1 ] || [ "$hours" -gt "$max_hours" ]; then
            echo "::error::hours=$hours does not fit in the $JOB_TIMEOUT_MINUTES min job timeout ($SOAK_RESERVE_MINUTES min reserve for setup + Layer 4b + upload + batch-start margin => max $max_hours h)"
            exit 1
          fi
          echo "SOAK_HOURS=$hours" >> "$GITHUB_ENV"
          echo "soak budget: $hours h of $JOB_TIMEOUT_MINUTES min job timeout ($SOAK_RESERVE_MINUTES min reserve)"

      - name: Layer 4a — generative soak (seeded programs, differential)
        env:
          GO_BIN_DIR: "${{ github.workspace }}/.go-bin"
          JAVA_BIN: "${{ env.JAVA_HOME }}/bin/java"
          JOBS: "4"
        run: |
          mkdir -p "$GO_BIN_DIR"
          ln -sf "$(which go)" "$GO_BIN_DIR/go"
          ./tools/fuzz-soak/run_soak.sh \
            --hours "$SOAK_HOURS" \
            --out "$GITHUB_WORKSPACE/fuzz-soak-out"

      - name: Layer 4b — native testing.F differential fuzzing
        env:
          GO_BIN_DIR: "${{ github.workspace }}/.go-bin"
          JOBS: "4"
        run: |
          ./test/differential/fuzz/run_fuzz_native.sh \
            --fuzztime 120 \
            --out "$GITHUB_WORKSPACE/fuzz-native-out"

      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-soak-report
          path: |
            fuzz-soak-out/
            fuzz-native-out/
          if-no-files-found: warn
