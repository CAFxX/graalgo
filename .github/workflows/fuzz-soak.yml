# Layer 4 — fuzz soak (SPEC §5.3, GG-0037): generative
# differential fuzzing + native testing.F differential fuzzing, overnight
# per release, both on the new path (`go build -toolexec graalgo-tool`).
#
# Cadence: nightly (the overnight per-release soak) plus manual dispatch.
# 4a: the new path's program generator (test/fuzz/gen.py, derived from v1's
# tools/fuzz-soak generator, deleted with its graalgo-sync-run harness at
# m3-plan D3) in batches of 200 seeded programs vs gc (`make fuzz-newpath
# FUZZ_CORPUS=0`) until the deadline, on a seed range disjoint from the
# nightly fuzz-newpath job's. 4b: the native testing.F targets with
# differential replay (test/differential/fuzz/run_fuzz_native.sh). A
# divergence not in test/fuzz/known.txt fails the step; minimized
# divergences become permanent regressions per SPEC §5.4 (test/fuzz/repro/).
name: fuzz-soak
# A dispatch's title carries its inputs: ci_status.sh lets only a dispatch
# with the default inputs supersede a red scheduled run (a reduced-scope
# dispatch proves nothing about the full run); other events keep the
# default title.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('fuzz-soak dispatch inputs: hours={0}', inputs.hours) || '' }}"

on:
  schedule:
    # Nightly overnight soak: 01:00 UTC.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      hours:
        # <= 4: the job's 360-minute limit must also cover setup, the last
        # soak batch's overrun past the deadline, the native fuzzing step
        # and the report upload. 5 h did not fit (cancelled every night,
        # 2026-11-16..18); larger values are clamped to 4 below.
        description: 'Soak duration in hours (max 4)'
        required: false
        default: '4'

jobs:
  fuzz-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: Build the backend
        run: make build

      - name: Layer 4a — generative soak (seeded programs, new path vs gc)
        # Step budget: <= 4 h of batches + the last batch's overrun (the
        # deadline is checked between batches). A hung batch fails this
        # step instead of cancelling the whole job, so 4b and the report
        # upload still run. Exit 1 = a new divergence, 3 = infra.
        timeout-minutes: 285
        env:
          HOURS_IN: "${{ inputs.hours || '4' }}"
        run: |
          out="$GITHUB_WORKSPACE/fuzz-soak-out"
          mkdir -p "$out"
          secs="$(awk -v h="$HOURS_IN" 'BEGIN { if (h + 0 > 4 || h + 0 <= 0) h = 4; printf "%d", h * 3600 }')"
          deadline=$(( $(date +%s) + secs ))
          # fuzz-newpath.yml seeds day*1000 + [0, n): this range never meets it.
          base=$(( $(date +%s) / 86400 * 1000000 + 500000000000 ))
          i=0 st=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            rc=0
            make fuzz-newpath FUZZ_CORPUS=0 N=200 SEED=$(( base + i * 200 )) \
              FUZZ_ARGS="--keep $out/fail --report $out/batch-$i.tsv" || rc=$?
            if [ "$rc" -ne 0 ]; then
              st=$rc
              [ "$rc" -eq 1 ] || break
            fi
            i=$(( i + 1 ))
          done
          echo "4a: $i batches of 200 programs from seed $base"
          exit "$st"

      - name: Layer 4b — native testing.F differential fuzzing
        # 8 targets x 120 s of fuzzing (~16 min) + the replay differential
        # through the -toolexec path (test/fuzz/run.py; <= 40 entries per
        # target, ~1 s each on a runner). It never produced a verdict before
        # 2026-11-23: the replay read testdata/fuzz/, where go writes only
        # failing inputs (the grown corpus lives in $GOCACHE/fuzz/).
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: |
          ./test/differential/fuzz/run_fuzz_native.sh \
            --fuzztime 120 --max-per-target 40 \
            --out "$GITHUB_WORKSPACE/fuzz-native-out"

      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-soak-report
          path: |
            fuzz-soak-out/
            fuzz-native-out/
          if-no-files-found: warn
