# Oracle validation by mutation (SPEC §5.7, GG-0034): nightly.
#
# tools/mutation deliberately breaks the new path (m3-plan G6: curated
# mutants in tools/mutation/mutants.json over the graalgo.go nodes and
# runtime, the scheduler, graalgo.syscall, the -toolexec emitter and the
# stdlib/ fork: off-by-one bounds, lost wakeups, select bias, defer order,
# recover eligibility, interface equality, checkptr, timer order, exit
# status, ...) on a scratch copy of the tree and confirms the per-push
# differential gates (snapshot-check, test-m1a/m1r/m1c/m1d/m1w13, narrowed
# to each mutant's kill programs; a survivor re-runs them in full) go red
# for each. A survivor without a reviewed survivorJustification fails this
# job: the per-push gates have a blind spot that needs a new program.
#
# Not per-push (one rebuild + a slice per mutant); per push, check-repo
# validates the set (every anchor applies exactly once).
name: mutation

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/mutation/**'
      - '.github/workflows/mutation.yml'

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: Build the backend
        run: make build

      - name: Mutation run (exit 1 = unjustified survivor, 3 = infra/red baseline)
        # MUTATION_JOBS=4: the snapshot gate runs four programs at a time on
        # the 4-vCPU runner (the m1 runners batch their programs in one JVM)
        run: make mutation MUTATION_WORK="$RUNNER_TEMP/mutation" MUTATION_JOBS=4

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: ${{ runner.temp }}/mutation/report.json
          if-no-files-found: warn
