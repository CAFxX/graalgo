# graalgo CI — per project standing order (2026-10-12): runs `make all`
# (regenerate generated artifacts + build + gates + fast tests +
# snapshot-check, the M10 behavior-drift gate) and then
# `git diff --exit-code` + `git status --porcelain`: if `make all`
# regenerates any file differently from what's committed (or leaves a new
# untracked one), the build fails.
#
# SCOPE (see [Makefile](../../Makefile) header): per-push CI runs `make all`
# (generate/build/snapshot-check/check/module tests/test-ci/test-java-fast/
# test-regression/test-m1a/pe-check-m1a/test-m1w13/test-imgcheck/test-m1r/
# test-m1c — the new -toolexec path's gc differential, PE, pointer-model,
# descriptor-image, std-library and M1c gates) plus the testing-strategy layers at their
# cadence (SPEC §5):
#   layer 1 (smoke):            per-commit  — `make all` -> snapshot-check:
#                               the differential corpus under graalgo vs
#                               gc's committed snapshot (this job); oracle
#                               validated nightly by mutating graalgo
#                               (`mutation.yml`)
#   layer 2 (conformance):      per-commit on frontend/backend/driver
#                               changes — GOROOT/test language suite
#                               (`conformance.yml`, paths-filtered)
#   layer 3 (stdlib+scripts):   per-release gate — wave corpora differential
#                               (`stdlib-gate.yml`: manual dispatch only —
#                               its weekly schedule is DISABLED until the
#                               wave corpora are triaged, BUG-0033 in
#                               docs/dev/bugs.md; it was red 5/5)
#   layer 4 (fuzz soak):        overnight per release — generative
#                               differential fuzzing (`fuzz-soak.yml`:
#                               nightly + manual dispatch; soak <= 4 h so
#                               the job fits GitHub's 360-min limit)
# The full differential suite (`make test`, 30+ min) is excluded from
# per-push CI by design — it runs in local verification and the weekly
# full-suite job. This is documented, not skipped.
name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly full-suite run: the long differentials excluded from per-push CI.
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The base of every "only moves forward" gate: the push's `before`
      # sha or the PR's base sha. The no-bridges gate diffs GATE_BASE...HEAD
      # (a fast-forward of N commits is checked whole, not just HEAD~1);
      # the ratchet gate refuses budgets above the base's; `req lint` rule
      # (f) refuses changed/removed LOCKED-TEXT.sum lines and status
      # regressions. Used by the step below and by `make check` (make all).
      GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the no-bridges gate needs GATE_BASE (and,
          # for its fallbacks, HEAD~1) — a shallow checkout has neither and
          # the gate would fail loudly instead of inspecting.
          fetch-depth: 0

      - name: No-bridges check (his 2026-10-15 order)
        run: python3 .github/scripts/check_no_bridges.py

      - name: No-bridges gate regression tests (pins the gate fix)
        # The gate's exemptions are pinned by
        # .github/scripts/test_check_no_bridges.py — run it here so a
        # future gate regression fails CI instead of reverting silently.
        run: python3 .github/scripts/test_check_no_bridges.py

      - name: Duplicate-FQN overlay check (review R-01)
        run: python3 .github/scripts/check_duplicate_fqn.py

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        # Phase Makefiles honor GRAALVM_HOME and GO when set.
        # (The env: context is not available in a job-level env mapping,
        # so export via $GITHUB_ENV instead.)
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: make all (generate + build + check + fast tests)
        run: make all

      - name: Fail on drift (generated files differ from committed, or new untracked files)
        # `git diff --exit-code` alone misses a generated file that is
        # untracked (never committed): porcelain lists both.
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "DRIFT: make all left modified or untracked files:"; git status --porcelain --untracked-files=all; exit 1
          fi

      - name: Harness self-test (diffharness comparator, gc-vs-gc)
        # Builds/vets/unit-tests the harness and checks the comparator on
        # gc-vs-gc: no false positives on the unmutated corpus, rerun
        # stability, sensitivity to mutated corpus programs. graalgo-vs-gc
        # is `make all` -> snapshot-check above; mutating graalgo itself is
        # the nightly mutation.yml.
        env:
          DH_TIMEOUT: "90"
        run: make test-diffharness

  full-suite:
    # The long differential suite, excluded from per-push CI by design
    # (Makefile header). Runs weekly and on manual dispatch.
    #
    # A standard runner has 4 vCPU / 16 GB. An uncapped `make test` once
    # killed the runner ("lost communication with the server", no log) about
    # three minutes in: TypeparamDifferentialTest runs the typeparam
    # differential with 4 parallel graalgo JVMs whose default heap is 1/4 of
    # RAM each (measured locally: ~13 GB resident within 25 s of its start).
    # So: every JVM's heap is capped, that test runs 2 jobs, a sampler streams
    # memory/load to the log, and the logs are uploaded even when the job dies.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Test JVMs (ClassListRunner) and the graalgo-run JVMs the tests spawn.
      JAVA_TEST_OPTS: -Xmx4g -XX:ActiveProcessorCount=4 -Dgraalgo.typeparam.jobs=2
      GRAALGO_JAVA_OPTS: -Xmx2g -XX:ActiveProcessorCount=4
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        # Phase Makefiles honor GRAALVM_HOME and GO when set.
        # (The env: context is not available in a job-level env mapping,
        # so export via $GITHUB_ENV instead.)
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: |
          echo "GO=$(which go)" >> "$GITHUB_ENV"
          # (the runner context is not available in a job-level env mapping)
          echo "FULL_SUITE_LOGS=$RUNNER_TEMP/full-suite-logs" >> "$GITHUB_ENV"

      - name: make test (full suite = test-java-fast + test-java-slow, quarantine-judged)
        # One step: `make test` already includes test-java-slow (Makefile).
        # The sampler prints a [watch] line every 20 s (the last ones before
        # a runner loss are the evidence); make's output is streamed, not
        # buffered.
        timeout-minutes: 80
        run: |
          mkdir -p "$FULL_SUITE_LOGS"
          .github/scripts/ci_watch.sh 20 "$FULL_SUITE_LOGS/watch.log" &
          watch=$!
          trap 'kill "$watch" 2>/dev/null || true' EXIT
          make test 2>&1 | tee "$FULL_SUITE_LOGS/make-test.log"

      - name: Summary (peak memory, per-class timings)
        if: always()
        run: |
          {
            echo "### full-suite"
            if [ -s "$FULL_SUITE_LOGS/watch.log" ]; then
              echo "min MemAvailable: $(grep -o 'avail=[0-9]*' "$FULL_SUITE_LOGS/watch.log" | cut -d= -f2 | sort -n | head -1) MB;" \
                "max load: $(grep -o 'load=[0-9.]*' "$FULL_SUITE_LOGS/watch.log" | cut -d= -f2 | sort -n | tail -1);" \
                "samples: $(wc -l < "$FULL_SUITE_LOGS/watch.log")"
            fi
            echo '```'
            grep -h '^CLASS ' internal/backend/*/out/test-tmp/java-slow-*.log 2>/dev/null | sort -k3 -n -r | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-logs
          path: |
            ${{ runner.temp }}/full-suite-logs
            internal/backend/*/out/test-tmp/java-slow-*.log
          if-no-files-found: warn
          retention-days: 14
