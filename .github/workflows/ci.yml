# graalgo CI — per project standing order (2026-10-12): runs `make all`
# (regenerate generated artifacts + build + gates + fast tests +
# snapshot-check, the M10 behavior-drift gate) and then
# `git diff --exit-code` + `git status --porcelain`: if `make all`
# regenerates any file differently from what's committed (or leaves a new
# untracked one), the build fails.
#
# SCOPE (see [Makefile](../../Makefile) header): per-push CI runs `make all`
# (generate/build/snapshot-check/check/module tests/test-ci/test-java-fast/
# test-regression) plus the testing-strategy layers at their
# cadence (SPEC §5):
#   layer 1 (smoke):            per-commit  — `make all` -> snapshot-check:
#                               the differential corpus under graalgo vs
#                               gc's committed snapshot (this job); oracle
#                               validated nightly by mutating graalgo
#                               (`mutation.yml`)
#   layer 2 (conformance):      per-commit on frontend/backend/driver
#                               changes — GOROOT/test language suite
#                               (`conformance.yml`, paths-filtered)
#   layer 3 (stdlib+scripts):   per-release gate — wave corpora differential
#                               (`stdlib-gate.yml`: weekly + manual dispatch)
#   layer 4 (fuzz soak):        overnight per release — generative
#                               differential fuzzing (`fuzz-soak.yml`:
#                               nightly + manual dispatch)
# The full differential suite (`make test`, 30+ min) is excluded from
# per-push CI by design — it runs in local verification and the weekly
# full-suite job. This is documented, not skipped.
name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly full-suite run: the long differentials excluded from per-push CI.
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The no-bridges gate diffs HEAD~1...HEAD on direct master pushes
          # (fast-forward merge of a lane branch + push, no PR) — a shallow checkout has no
          # HEAD~1 and the gate would fail loudly instead of inspecting.
          fetch-depth: 0

      - name: No-bridges check (his 2026-10-15 order)
        run: python3 .github/scripts/check_no_bridges.py

      - name: No-bridges gate regression tests (pins the gate fix)
        # The gate's exemptions are pinned by
        # .github/scripts/test_check_no_bridges.py — run it here so a
        # future gate regression fails CI instead of reverting silently.
        run: python3 .github/scripts/test_check_no_bridges.py

      - name: Duplicate-FQN overlay check (review R-01)
        run: python3 .github/scripts/check_duplicate_fqn.py

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        # Phase Makefiles honor GRAALVM_HOME and GO when set.
        # (The env: context is not available in a job-level env mapping,
        # so export via $GITHUB_ENV instead.)
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: make all (generate + build + check + fast tests)
        run: make all

      - name: Fail on drift (generated files differ from committed, or new untracked files)
        # `git diff --exit-code` alone misses a generated file that is
        # untracked (never committed): porcelain lists both.
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "DRIFT: make all left modified or untracked files:"; git status --porcelain --untracked-files=all; exit 1
          fi

      - name: Harness self-test (diffharness comparator, gc-vs-gc)
        # Builds/vets/unit-tests the harness and checks the comparator on
        # gc-vs-gc: no false positives on the unmutated corpus, rerun
        # stability, sensitivity to mutated corpus programs. graalgo-vs-gc
        # is `make all` -> snapshot-check above; mutating graalgo itself is
        # the nightly mutation.yml.
        env:
          DH_TIMEOUT: "90"
        run: ./test/differential/run.sh

  full-suite:
    # The long differential suite, excluded from per-push CI by design
    # (Makefile header). Runs weekly and on manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        # Phase Makefiles honor GRAALVM_HOME and GO when set.
        # (The env: context is not available in a job-level env mapping,
        # so export via $GITHUB_ENV instead.)
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: make test (full differential suite)
        run: make test

      - name: Slow Java unit tests (corpus differentials, stress)
        run: make test-java-slow
