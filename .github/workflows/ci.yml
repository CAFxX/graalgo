# graalgo CI — per project standing order (2026-10-12): runs `make all`
# (regenerate generated artifacts + build + gates + fast tests +
# snapshot-check, the M10 behavior-drift gate) and then
# `git diff --exit-code`: if `make all` regenerates any tracked file
# differently from what's committed, the build fails.
#
# SCOPE (see [Makefile](../../Makefile) header): per-push CI runs the fast subset
# (generate/build/check/test-ci) plus the testing-strategy layers at their
# cadence (phases/phase3/PLAN.md §5):
#   layer 1 (smoke):            per-commit  — diffharness smoke corpus,
#                               mutation-validated oracle (this job)
#   layer 2 (conformance):      per-commit on frontend changes —
#                               GOROOT/test language suite (`conformance` job,
#                               paths-filtered)
#   layer 3 (stdlib+scripts):   per-release gate — wave corpora differential
#                               (`stdlib-gate.yml`: weekly + manual dispatch)
#   layer 4 (fuzz soak):        overnight per release — generative
#                               differential fuzzing (`fuzz-soak.yml`:
#                               nightly + manual dispatch)
# The full differential suite (`make test`, 30+ min) is excluded from
# per-push CI by design — it runs in local verification and the weekly
# full-suite job. This is documented, not skipped.
name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly full-suite run: the long differentials excluded from per-push CI.
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The no-bridges gate diffs HEAD~1...HEAD on direct master pushes
          # (wt.py integrate + push, no PR) — a shallow checkout has no
          # HEAD~1 and the gate would fail loudly instead of inspecting.
          fetch-depth: 0

      - name: No-bridges check (his 2026-10-15 order)
        run: python3 .github/scripts/check_no_bridges.py

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        # Phase Makefiles honor GRAALVM_HOME and GO when set.
        # (The env: context is not available in a job-level env mapping,
        # so export via $GITHUB_ENV instead.)
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: make all (generate + build + check + fast tests)
        run: make all

      - name: Fail on drift (generated files differ from committed)
        run: git diff --exit-code

      - name: Driver — build, vet, test
        # cmd/graalgo + internal/driver + internal/vet are compiled and
        # tested nowhere else in CI (review 2026-10-15 found a broken
        # `graalgo build` default output path because of it). The binary
        # goes to a temp dir so `git diff --exit-code` above stays clean.
        run: |
          go build -o "$(mktemp -d)/graalgo" ./cmd/graalgo/
          go vet ./cmd/graalgo/ ./internal/driver/ ./internal/vet/
          go test ./cmd/graalgo/ ./internal/driver/ ./internal/vet/

      - name: Layer 1 — smoke (diffharness, per-commit)
        # Curated differential smoke corpus (46 programs, gc-a vs gc-b vs
        # graalgo-P3SyncMain) with mutation-validated oracles. PHASE3_DIR
        # defaults to this repo's internal/backend (the graalgo-sync-run
        # product launcher); DH_GO falls back to PATH (setup-go).
        # DH_TIMEOUT=90 gives the JVM backend headroom on shared runners.
        # `make all` above built truffle+runtime+interop (required by the backend).
        env:
          DH_TIMEOUT: "90"
        run: ./test/differential/run.sh

  full-suite:
    # The long differential suite, excluded from per-push CI by design
    # (Makefile header). Runs weekly and on manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        # Phase Makefiles honor GRAALVM_HOME and GO when set.
        # (The env: context is not available in a job-level env mapping,
        # so export via $GITHUB_ENV instead.)
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: make test (full differential suite)
        run: make test
