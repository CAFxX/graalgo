# Layer 3 — stdlib per-release gate (SPEC §5.3, GG-0029/GG-0032) on the
# new path (m3-plan D3): `make stdlib-gate` runs every test/corpus program
# that imports a package (the wave1/wave2/wave3 corpora, the topic and phase
# dirs; 486 programs) through graalgo-tool on the node package against gc
# (test/m1r/run.sh) and judges the result against the reviewed register
# test/corpus/std-register.tsv (test/corpus/std_gate.py: an unlisted or
# re-signed divergence is DRIFT, a listed program that matches gc is STALE).
# v1's 76 wave run_differential.sh and the run_wave*.sh drivers were deleted.
#
# Manual dispatch only (BUG-0033: the register's entries are the measured
# divergences, not yet triaged into fixes; the schedule comes back with
# that triage). ~10-15 min.
name: stdlib-gate

on:
  workflow_dispatch:

jobs:
  stdlib-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: Layer 3 — stdlib gate (test/corpus programs with imports, new path vs gc)
        run: make stdlib-gate STDLIB_GATE_REPORT="$RUNNER_TEMP/stdlib-gate.report"

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-gate-report
          path: ${{ runner.temp }}/stdlib-gate.report
          if-no-files-found: warn
