# Layer 3 — stdlib + scripts per-release gate (SPEC §5.3,
# GG-0029/GG-0032): wave1/wave2/wave3 corpora differential vs stock gc.
#
# Cadence: weekly (the per-release gate — releases cut from a green gate)
# plus manual dispatch. Hours-scale by design; the four-way triage per red
# (graalgo bug / upstream change / backend-specific+reason-code /
# nondeterminism-normalization) is recorded in the run's report.json.
name: stdlib-gate

# DISABLED (schedule removed 2026-11-18, ci-green2 lane): red on every run
# since inception (5/5) — BUG-0033. The weekly runs failed before running a
# single program (the runners built the deleted phase-3 module: `make: ***
# No rule to make target 'main'`); today's runners work, but the wave
# corpora carry untriaged real divergences (e.g. wave1 errors/08_as:
# `panic: clear: errP should be nil`). Re-enable the cron when the corpora
# are triaged (fix or reason-coded exclusion per GG-0033). Manual dispatch
# stays for that triage.
on:
  workflow_dispatch:

jobs:
  stdlib-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: Layer 3 — stdlib gate (wave corpora differential)
        env:
          GO_BIN_DIR: "${{ github.workspace }}/.go-bin"
          JAVA_BIN: "${{ env.JAVA_HOME }}/bin/java"
        run: |
          mkdir -p "$GO_BIN_DIR"
          ln -sf "$(which go)" "$GO_BIN_DIR/go"
          ./tools/run_stdlib_gate.sh

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-gate-report
          path: .out/stdlib-gate/layer3-*/
          if-no-files-found: warn
