# Layer 2 — conformance (docs/arch/phases/phase3/PLAN.md §5, GG-0029/GG-0032):
# GOROOT/test language suite (356 files), per-commit on frontend changes.
#
# The srctest adapter (test/differential/internal/srctest) classifies every
# file (run / errorcheck / structural exclusions) and runs the
# language-conformance subset differential gc vs graalgo through the shared
# diffharness oracle. Exclusions are versioned and reason-coded in
# test/differential/srctest-exclusions.yaml (GG-0033).
name: conformance

on:
  push:
    paths:
      - 'internal/frontend/**'
      - 'test/differential/**'
  pull_request:
    paths:
      - 'internal/frontend/**'
      - 'test/differential/**'
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: Build backend (graalgo-run)
        run: make -C internal/backend/truffle main && make -C internal/backend/runtime main && make -C internal/backend/interop main

      - name: Conformance differential (GOROOT/test vs gc)
        # actions/setup-go ships a full GOROOT including test/.
        env:
          DH_TIMEOUT: "90"
          JOBS: "4"
        run: ./test/differential/run_conformance.sh
