# Layer 2 — conformance (SPEC §5.2, GG-0029/GG-0032): GOROOT/test language
# suite (356 files), per-commit on any change that can alter lowering or
# runtime behavior (frontend, backend, driver, harness).
#
# The srctest adapter (test/differential/internal/srctest) classifies every
# file (run / errorcheck / notrun) and runs every runnable one differential
# gc vs graalgo under the PRODUCT launcher (P3SyncMain). Expected
# divergences are explicit, reason-coded entries in
# test/differential/srctest-exclusions.yaml (SPEC §5.6); a listed file that
# now matches gc fails the run (stale entry).
name: conformance

on:
  push:
    paths:
      - 'internal/frontend/**'
      - 'internal/backend/**'
      - 'internal/driver/**'
      - 'cmd/graalgo/**'
      - 'internal/toolexec/**'
      - 'stdlib/**'
      - 'test/differential/**'
      - 'test/lib/**'
      - 'Makefile'
      - '.github/workflows/conformance.yml'
  pull_request:
    paths:
      - 'internal/frontend/**'
      - 'internal/backend/**'
      - 'internal/driver/**'
      - 'cmd/graalgo/**'
      - 'internal/toolexec/**'
      - 'stdlib/**'
      - 'test/differential/**'
      - 'test/lib/**'
      - 'Makefile'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.4'  # pinned: docs/dev/ENV.md + lib/*-25.0.4.1.1.jar
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GRAALVM_HOME
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Export GO for the Makefiles
        run: echo "GO=$(which go)" >> "$GITHUB_ENV"

      - name: Build frontend + backend (product launcher graalgo-sync-run)
        run: make generate build

      - name: Conformance differential (GOROOT/test vs gc)
        # actions/setup-go ships a full GOROOT including test/.
        env:
          DH_TIMEOUT: "90"
          JOBS: "4"
        run: ./test/differential/run_conformance.sh
