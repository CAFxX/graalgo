# GOROOT/test conformance exclusions (conformance layer, GG-0033).
#
# Versioned, reason-coded per GG-0033: backend-specific / unspecified-behavior /
# deferred-parity. Structural exclusions (build constraints, non-main packages,
# stdlib imports, concurrency) are classified by the srctest adapter itself;
# this file is for per-file triage of differential divergences (four-way triage
# per PLAN §5: graalgo bug / upstream change / backend-specific+reason-code /
# nondeterminism-normalization).
#
# version history:
#   1 (2026-10-13): initial triage — 39 divergences from the 2026-10-13 differential.
#       F-1..F-6 are graalgo bugs filed for the frontend/scheduler lanes.
#   2 (2026-11-18): layer 2 moved to the product launcher (P3SyncMain) and
#       lost its automatic exclusions; listed files now still run (STALE when
#       they match gc). Sample of 10 verified: alg.go matches gc (pruned);
#       append.go, chancap.go, cmp.go newly compared and diverging (added).
#       The remaining ~120 newly-compared runnable files are NOT yet triaged:
#       the first full run will list them as DIVERGE for triage.
#   3 (2026-11-18): the 32 `backend-specific` entries were graalgo bugs
#       (v1 frontend scope gaps and F-2..F-6), not backend-specific behavior
#       (SPEC §5.6 reserves that code for behavior gc leaves to the
#       implementation): recoded `deferred-parity`, each citing its bug id
#       in docs/dev/bugs.md.
#   4 (2026-11-18, ci-green lane): full triage of the first complete run
#       (CI: 69 unexpected). Harness artifacts fixed in the adapter (action
#       lines: // skip, // compile, // build, // run args, GOROOT/test cwd;
#       stable {WORK}/{VAR} divergence texts); structural backend fixes
#       (named chan types, chan ==, send boxing) made 235.go, chancap.go,
#       convT2X.go, named.go, struct0.go, typeswitch.go match; 14 stale
#       entries pruned. Every remaining entry cites a docs/dev/bugs.md id
#       (deferred-parity) or the spec clause leaving the behavior to the
#       implementation (unspecified-behavior), and pins the divergence
#       signature except where the text is not reproducible (timings,
#       timestamps). Local run: JOBS=1, -Xmx2g.
#   5 (2026-11-18, ci-green2 lane): gc2.go (CI-only timeout, BUG-0026)
#       added. args.go, blank.go, bigmap.go, const3.go and defer.go,
#       reported DIVERGE/STALE by earlier CI runs, re-run locally with
#       `srctest run -files` (JOBS=1, -Xmx2g): blank.go EXPECTED as pinned,
#       the others match gc and are not listed — the earlier reports
#       predate version 4.
