# GOROOT/test conformance exclusions (conformance layer, GG-0033).
#
# Versioned, reason-coded per GG-0033: backend-specific / unspecified-behavior /
# deferred-parity. Structural exclusions (build constraints, non-main packages,
# stdlib imports, concurrency) are classified by the srctest adapter itself;
# this file is for per-file triage of differential divergences (four-way triage
# per PLAN §5: graalgo bug / upstream change / backend-specific+reason-code /
# nondeterminism-normalization).
#
# version history:
#   1 (2026-10-13): initial triage — 39 divergences from the 2026-10-13 differential.
#       F-1..F-6 are graalgo bugs filed for the frontend/scheduler lanes.
#   2 (2026-10-18): first re-triage (rv18-exclusion-staleness lane) via
#       diffharness --recheck-excluded + direct differential runs.
#       Removed 7 stale entries (all XPASS-verified: differential now agrees
#       with gc on the file):
#       - 235.go: SHADOWED — the scanner already excludes it as
#         exclude:deferred-parity (uses chan/go); the YAML entry was redundant.
#         F-2 (named result assignment) remains a tracked frontend bug.
#       - func.go, nilptr4.go, unsafe_string.go: frontend scope gaps overtaken
#         by the multi-result fix stream (56a3dd68, 47840bf8, 886ffb51).
#       - gc.go: runtime.GC() is callable and observably identical (the test
#         has no output); the Phase-2 GC-interop concern does not materialize.
#       - print.go: GG-0030 reason inapplicable — the test prints no non-nil
#         pointer addresses (only nils, scalars, strings); outputs agree.
#       - solitaire.go: F-6 overtaken — the solver finds solutions; output
#         byte-identical to gc (incl. "391865 moves tried").
#       divmod.go detail updated: builds since the MR fix stream; does not
#       complete within the per-program timeout on the ~4M-case interpreter
#       run (gc finishes in <60s) — still excluded, reason now performance.
#       Masked by red-master abifuncpc breakage (inconclusive, kept as-is):
#       alg.go, const3.go, convert5.go, defer.go, inline_callers.go,
#       stackobj.go, literal2.go.
#       Re-triage cadence: verify on every conformance run
#       (srctest scan --verify-exclusions); recheck weekly
#       (RECHECK_EXCLUDED=1 run_conformance.sh). See
#       test/differential/README.md "Exclusion-list hygiene".
