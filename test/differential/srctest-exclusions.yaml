# GOROOT/test conformance exclusions (conformance layer, GG-0033).
#
# Versioned, reason-coded per GG-0033: backend-specific / unspecified-behavior /
# deferred-parity. Structural exclusions (build constraints, non-main packages,
# stdlib imports, concurrency) are classified by the srctest adapter itself;
# this file is for per-file triage of differential divergences (four-way triage
# per PLAN §5: graalgo bug / upstream change / backend-specific+reason-code /
# nondeterminism-normalization).
#
# Exclusion amnesty (P1-Q): an exclusion is a loan against the conformance
# gate, not a permanent deletion. Every entry carries:
#   last-revalidated: YYYY-MM-DD — the day the excluded file was last
#     re-probed (via `diffharness srctest run -amnesty`) and the exclusion
#     confirmed still valid — or the exclusion removed because the file now
#     passes. The freshness gate (typeparam.CheckExclusionFreshness, run in
#     `go test ./internal/...`) fails on missing/malformed/future dates and
#     on dates older than harness.MaxExclusionAgeDays (90 days): a fixed bug
#     must not hide behind its exclusion.
#   issue: <id> — optional; when the detail records a filed graalgo bug
#     (F-1..F-6), names it so the bug's remediation lane re-probes this file
#     on closure instead of waiting for the 90-day backstop.
# Flaky exclusions need repeated clean probes before removal — one lucky run
# proves nothing.
#
# version history:
#   1 (2026-10-13): initial triage — 39 divergences from the 2026-10-13 differential.
#       F-1..F-6 are graalgo bugs filed for the frontend/scheduler lanes.
#   2 (2026-10-18): exclusion amnesty — last-revalidated dates + issue links (P1-Q).
