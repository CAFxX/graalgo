# typeparam-exclusions.yaml — versioned exclusion list for the
# test/typeparam differential adapter (M6/D2 acceptance).
#
# GG-0033: every excluded test/typeparam file carries a reason code; the
# list is versioned and the acceptance test enforces coverage, freshness,
# and code validity.
#
# Reason codes:
#   backend-specific     — tests gc-specific behavior (cgo, compiler
#                          diagnostics, error-message text); not a
#                          portability observable.
#   unspecified-behavior — the program's output is nondeterministic or
#                          implementation-defined (map order, timing).
#   deferred-parity      — needs a feature from a later milestone/
#                          workstream (multi-file packages = WS G import
#                          overlay; unimplemented stdlib imports).
#
# Groups (version 5, 2026-11-18): the 208 v1 scope-limit entries are
# collapsed into one group per cause; every group expires at M3, when the
# v1 frontend is deleted (toolexec-design D11) and the typeparam suite runs
# through the toolexec path. Per-file details of the old entries are in git
# history (version 4). Entries that are not v1 scope limits stay individual.
version: 5
exclusions:
- file: issue54765.go
  reason: backend-specific
  detail: //go:build cgo: graalgo has no cgo support
- file: append.go
  reason: deferred-parity
  detail: "named type use as value: identifier 'Recv' denotes *types.TypeName"
- file: interfacearg.go
  reason: deferred-parity
  detail: "named type use as value: identifier 'T' denotes *types.TypeName"
- file: issue48453.go
  reason: deferred-parity
  detail: "named type use as value: identifier 'M' denotes *types.TypeName"
- file: issue50419.go
  reason: deferred-parity
  detail: "fmt Stringer dispatch not implemented (pre-existing missing feature; non-generic Stringer also fails)"
- file: issue50690a.go
  reason: deferred-parity
  detail: "WS D: calling function value l.SumFn()(...); method lookup fixed (methodIndex) but function-value call out of scope"
- file: issue50690b.go
  reason: deferred-parity
  detail: "WS D: calling function value; method lookup fixed (methodIndex) but function-value call out of scope"
- file: issue50833.go
  reason: deferred-parity
  detail: "use of variable 'f' before declaration (rejected by go/types)"
- file: issue51303.go
  reason: deferred-parity
  detail: "runtime ClassCastException: [J cannot be cast to [I (int64-slice vs int-slice confusion; pre-existing, non-generic)"
- file: issue54225.go
  reason: deferred-parity
  detail: "method Len on type parameter with non-named argument type: interface dispatch on type parameters not supported (WS H)"
- file: issue58513.go
  reason: deferred-parity
  detail: "go/types type error in test program (rejected before export)"
- file: pragma.go
  reason: backend-specific
  detail: "tests gc -m inliner diagnostics (\"can inline\" output for //go:noinline stenciling); gc compiler-diagnostic text is not a portability observable"
- file: typeswitch2.go
  reason: deferred-parity
  detail: "residual ClassCastException on f[float64](int8(9)) (expected \"other 9\"): int8 in default clause; reproduced non-generically, pre-existing factory bug. B2b struct-descriptor path fixed (lines 1-4 now print)"
- file: typeswitch6.go
  reason: deferred-parity
  detail: "case T with T instantiated to an interface: type switch uses descriptor identity, not interface satisfaction (same pre-existing limitation as typeswitch1)"
- file: typeswitch7.go
  reason: deferred-parity
  detail: "case interface{bar() T} with a type parameter inside the interface case: not matched by descriptor identity (same pre-existing limitation family as typeswitch1)"
- file: typeswitch1.go
  reason: deferred-parity
  detail: "case T: where T is a type parameter instantiated to an interface (e.g. any) does not match: type switch uses descriptor identity (t == dyn), not interface satisfaction. Pre-existing limitation."
