# typeparam-exclusions.yaml — versioned exclusion list for the
# test/typeparam differential adapter (M6/D2 acceptance).
#
# GG-0033: every excluded test/typeparam file carries a reason code; the
# list is versioned and the acceptance test enforces coverage, freshness,
# and code validity.
#
# Exclusion amnesty (P1-Q): an exclusion is a loan against the M6
# acceptance gate, not a permanent deletion. Every entry carries:
#   last-revalidated: YYYY-MM-DD — the day the excluded file was last
#     re-probed (via `diffharness typeparam run -amnesty`) and the
#     exclusion confirmed still valid — or the exclusion removed because
#     the file now passes. The freshness gate
#     (TypeparamDifferentialTest.testExclusionListCoversAllFiles and
#     typeparam.CheckExclusionFreshness in `go test ./internal/...`) fails
#     on missing/malformed/future dates and on dates older than 90 days: a
#     fixed bug must not hide behind its exclusion.
#   issue: <id> — optional; when the detail records a filed graalgo bug,
#     names it so the bug's remediation lane re-probes this file on
#     closure instead of waiting for the 90-day backstop.
# Flaky exclusions need repeated clean probes before removal — one lucky
# run proves nothing.
#
# Reason codes:
#   backend-specific     — tests gc-specific behavior (cgo, compiler
#                          diagnostics, error-message text); not a
#                          portability observable.
#   unspecified-behavior — the program's output is nondeterministic or
#                          implementation-defined (map order, timing).
#   deferred-parity      — needs a feature from a later milestone/
#                          workstream (multi-file packages = WS G import
#                          overlay; unimplemented stdlib imports).
#
# version history:
#   5 (2026-10-18): exclusion amnesty — last-revalidated dates on every
#       entry (P1-Q).
