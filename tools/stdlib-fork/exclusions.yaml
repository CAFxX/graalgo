# exclusions.yaml — versioned stdlib-package exclusion list, v2 (P3-M6;
# v2: ASM_UNCATEGORIZED renamed to ASM_UNSUPPORTED -- the old name
# contradicted the asm inventory's generator invariant).
#
# GG-0033 machinery applies: flat "- file:" entries, "reason:" mandatory per
# entry, "detail:" carries the evidence, "version:" line present. Parsed with
# the same line-based semantics as test/differential LoadExclusions and the
# Java readExclusions in TypeparamDifferentialTest: the "reason_codes:"
# section below is invisible to those readers ("reason_codes:" does not
# carry the "reason:" prefix; "- code:" does not carry the "- file:"
# prefix), so this file stays readable by the existing GG-0033 tooling.
#
# Standing review cap (user-approved proposal, P3-M6): 25 packages OR 5% of
# stdlib test binaries, whichever binds first. On go1.27.1 the 5% clause
# binds: 274 test binaries -> floor(5*274/100) = 13. Enforced by
# `stdlib-excl validate` (tools/stdlib-excl), wired into root `make check`
# (via the `internal/backend/interop` `check` exclusion-list gate), run by
# CI via `make all`.
#
# v1 is the MECHANICS publication: entries are minimal and restricted to
# packages with concrete, decided evidence (SPEC citations). Packages the
# waves have not triaged are LEFT OUT — no weak entries, no known-issues
# parking (see coupled-packages-go1.27.1.md for the triage pipeline).
#
# Reason-code vocabulary (validator rejects unknown codes):
#   PLATFORM            — package is outside the OS/arch scope: linux/amd64
#                         first, darwin deferred, Windows out of v1 scope
#                         (SPEC §3.8, GG-0023).
#   CGO                 — package requires `import "C"`; cgo runs through
#                         Panama (GG-0022), not implemented yet (BUG-0028;
#                         GG-0058 bans it only in momo module code).
#   ASM_UNSUPPORTED       — package's .s/.S/.sx files sit in the P3-M6 asm
#                         inventory's "unsupported" (fail-fast) category:
#                         no replacement strategy decided yet (SPEC §2.8;
#                         ADR-0007). (The inventory itself has no
#                         "uncategorized" files by construction -- the
#                         generator fails on any file matching no rule.)
#   LINKNAME_MISSING    — package needs a //go:linkname symbol the graalgo
#                         intrinsic surface does not provide (linkname-diff
#                         worker taxonomy, P3-M6).
#   UNSUPPORTED_FEATURE — feature stubbed as unsupported by a DECIDED spec
#                         statement (SPEC §3.8; plugin's full scope §7.7).
#   DEFERRED_WAVE       — triaged by the M7–M9 four-way classification to a
#                         later package wave.
#   NONPORTABLE_BEHAVIOR — package tests nondeterministic or
#                         backend-specific behavior that is not a
#                         portability observable (mirrors GG-0033
#                         unspecified-behavior).
# v3 (2026-11-18): one vocabulary across every exclusion list — each code
# declares the SPEC §5.6 reason code it refines (`class:`, validated):
# PLATFORM/CGO/UNSUPPORTED_FEATURE -> backend-specific (decided v1 scope),
# ASM_UNSUPPORTED/LINKNAME_MISSING/DEFERRED_WAVE -> deferred-parity,
# NONPORTABLE_BEHAVIOR -> unspecified-behavior.
# v4 (2026-11-18, ci-green2 lane): entries use the SPEC §5.6 codes directly
# (the validator accepts them; the refined codes stay as vocabulary).
# runtime/cgo and plugin are graalgo gaps, not backend-specific behavior:
# deferred-parity with BUG-0028 / BUG-0029 (diffharness registers gate).
# CGO's class corrected to deferred-parity.
version: 4
reason_codes:
- code: PLATFORM
  description: outside OS/arch scope (linux/amd64 first; darwin deferred; Windows out of v1 per SPEC §3.8 GG-0023)
  class: backend-specific
- code: CGO
  description: requires import "C"; cgo runs through Panama per GG-0022 and is not implemented yet (BUG-0028); GG-0058 bans it only in momo module code
  class: deferred-parity
- code: ASM_UNSUPPORTED
  description: package's .s/.S/.sx files are in the asm inventory's unsupported (fail-fast) category -- no replacement strategy decided yet (SPEC §2.8; ADR-0007)
  class: deferred-parity
- code: LINKNAME_MISSING
  description: needs a //go:linkname symbol the intrinsic surface does not provide
  class: deferred-parity
- code: UNSUPPORTED_FEATURE
  description: feature stubbed as unsupported by a DECIDED spec statement
  class: backend-specific
- code: DEFERRED_WAVE
  description: triaged by the M7–M9 four-way classification to a later package wave
  class: deferred-parity
- code: NONPORTABLE_BEHAVIOR
  description: tests nondeterministic or backend-specific behavior, not a portability observable
  class: unspecified-behavior
exclusions:
- file: runtime/cgo
  reason: deferred-parity
  detail: BUG-0028 (no cgo; GG-0022 requires cgo through Panama, WP-CGO1/2): runtime/cgo can neither build nor test on graalgo today. (Was CGO/backend-specific — cgo is a graalgo gap, not behavior gc leaves to the implementation.)
- file: plugin
  reason: deferred-parity
  detail: BUG-0029 (plugin not implemented; GG-0051 requires plugin.Open in mode (a), a documented error in (b)/(c); WP-PLG). (Was UNSUPPORTED_FEATURE/backend-specific.)
