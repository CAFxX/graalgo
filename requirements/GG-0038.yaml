id: GG-0038
title: Gate integration and triage
statement: Per-commit CI SHALL run layers 1-2; per-release SHALL run all four layers; every red gate SHALL produce a triage record (graalgo bug / upstream change / backend-specific / nondeterminism) with disposition; no gate SHALL be waived without a recorded reason.
rationale: Waivers are how toil becomes unbounded.
