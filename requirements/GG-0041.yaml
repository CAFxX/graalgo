id: GG-0041
title: Release-watch agent
statement: A weekly release-watch agent SHALL detect rc1/.0, prepare `bump/go1.N` (vendor + regen + all diffs + intake report with estimates), and notify; it SHALL never merge, declare done-gates, or edit the exclusion list.
rationale: Preparation is mechanical (~4-8 agent-hours); judgment stays in the upgrade workflow.
