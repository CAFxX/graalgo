id: GG-0041
title: Release-watch agent
statement: A weekly release-watch agent SHALL detect rc1/.0, prepare `bump/go1.N` (vendor + regen + all diffs + intake report with estimates), and notify; it SHALL never merge, declare done-gates, or edit the exclusion list.
rationale: Preparation is mechanical (~4-8 agent-hours); judgment stays in the upgrade workflow.
parent: ""
status: locked
superseded_by: ""
verification_plan: Watch-agent dry run; intake report completeness. (Not yet exercisable — see traceability.)
traceability: 'No live trace: no release-watch agent, cron, or scheduled job exists in the repo or workspace schedules (references only in archived docs/arch/). Re-test trigger: a release-watch agent is created, or the first tracked release arrives with an intake report.'
