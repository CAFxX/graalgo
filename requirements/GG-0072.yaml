id: GG-0072
title: Flat Java-object value model with a byte region
statement: 'Go values SHALL live as Java objects without native addresses: a struct or array value SHALL be stored flat — nested struct and array fields inlined — as one flat object of three typed regions: a long[] of scalar leaves (integers as long, floats as double), an Object[] of reference leaves, and a byte[] of one-byte leaves (uint8, int8 and bool, as fields and as array elements alike), with a per-type leaf table derived from the gc layout (types.SizesFor("gc", GOARCH)) mapping each gc byte offset to its region and index, and an inverse table mapping region and index back to the gc byte offset; every scalar leaf wider than one byte SHALL stay a long or double slot. The region and index of a typed access SHALL be fixed by the static type, with no shape check and no leaf-table lookup. Slices SHALL have one shape, {base, prim, ref, byt, len, cap} — a window into the regions of the backing flat object — so that a []byte over a made array and a []byte over a struct''s inlined [N]byte field address the same byte[], and string(b) and []byte(s) are one array copy; strings SHALL be immutable windows (offset, length) into a byte[], so that unsafe.String, unsafe.StringData and unsafe.Slice can share storage; interfaces (itab, data); maps a runtime-owned table. A Go pointer SHALL be a Java reference to its referent object plus a gc byte offset within it, never a native address. A conversion of an unsafe.Pointer to *U SHALL yield the same object when U''s leaves coincide with the referent''s leaves from that location on (same kinds, sizes and relative gc offsets), and otherwise a view pointer (referent, gc byte offset) whose loads and stores go by gc byte offset through the leaf table, so that an N-byte scalar is assembled from or spread over the leaves it covers and a pointer word is exactly one reference leaf; typed code SHALL never observe a view. A view over a variable of interface, string or slice type SHALL expose gc''s header words by reading the immutable header object in the slot that holds it and, on a store, replacing that object, never mutating a header object that may have been copied. A model of one Java object per nested struct (v1 nested GoStruct) SHALL NOT be carried into the toolexec backend.'
rationale: 'Re-issue of GG-0061 for ADR-0015 (accepted by the owner 2026-11-18), whose locked text became false: it says a struct or array is one long[] of scalar leaves plus one Object[] of reference leaves and that slices are typed-Java-array-backed {array, offset, len, cap}, while ADR-0015 adds a byte[] region for one-byte leaves and fixes the single slice shape {base, prim, ref, byt, len, cap} (SPEC 3.4). Keeps GG-0015''s goals (GC integration with exact roots and free write barriers, PE/escape-analysis visibility, closed-world compatibility) and makes them addressable by gc byte offset, which verbatim internal/abi, reflect, sync and the syscall executor require; the nested-object model is the measured cause of 20 of 50 reflect-probe failures and does not converge (abi-spike.md 1.2-1.3). The byte region removes the two measured costs of long-slot bytes — 8 bytes per byte with a loop on every string/[]byte conversion, and no zero-copy unsafe.String/unsafe.Slice — and the aliasing case that blocked typed slice backing (a []byte over a struct''s [N]byte field) disappears because the struct''s byte array is typed too, with one slice shape. Checked conversions with view pointers replace the unchecked identity that read the wrong slots without failing (math.Float32bits, atomic.Value, interface-header views).'
