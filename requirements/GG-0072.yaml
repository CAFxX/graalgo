verification_plan: 'Value-model conformance tests; GC-correctness stress; leaf tables (regions, indices and the inverse table) checked against gc layout by the descview/imgcheck gate over a >=300-type corpus; a unit suite of loads and stores of 1-, 2-, 4- and 8-byte scalars and pointer words at every gc byte offset of a generated corpus of struct and array types, through typed pointers and through views, compared with gc''s own answers (a seeded wrong offset, a wrong region and a wrong width each fail it); one-byte leaves (uint8, int8, bool) shown to live in the byte[] region as fields and as array elements, and a []byte over a make''d array and over a struct''s inlined [N]byte field shown to alias the same byte[]; string(b), []byte(s), unsafe.String and unsafe.Slice shown to copy once or share storage as specified; checked-conversion tests (same object when the leaves coincide, a view otherwise, never an unchecked identity) and header-view tests (packEface-style eface words, atomic.Value, reflect.SliceHeader-style SetLen: stores replace the header object and values copied earlier keep their value); pe-check with zero bailouts and bench showing no regression on typed paths; reflectprobe 126/126 vs gc; corpus differential, including errors.Is/As, sort.Slice, atomic.Value and strings.Builder programs.'
