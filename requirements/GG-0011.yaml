id: GG-0011
title: Driver wrapper via -toolexec
statement: graalgo SHALL ship the stock Go distribution and swap only the compile backend behind the existing `-toolexec` seam; the driver SHALL NOT be reimplemented; forking `cmd/go` is permitted only as a priced escape hatch if argv interception proves insufficient.
rationale: Reimplementation rejected (~74k LOC, lowest fidelity-per-effort); the wrapper halves per-release driver toil vs a fork.
parent: ""
status: locked
superseded_by: ""
verification_plan: Driver architecture conformance via driver unit tests (cmd/graalgo/*_test.go), the differential corpus (test/differential/run.sh), and make snapshot-check (test/snapshots/ baseline). Wrapper-vs-fork toil comparison is moot post-fork; per-release upgrade toil has no live tracking process yet.
known_gap: 'Statement ("the driver SHALL NOT be reimplemented") predates the architecture decision: cmd/graalgo is a reimplemented driver CLI (implements build, run, test, vet, fmt). The -toolexec wrapper path was not pursued. Trigger: the statement is re-scoped via a superseding requirement describing the reimplemented-driver architecture.'
