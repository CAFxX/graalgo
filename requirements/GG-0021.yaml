id: GG-0021
title: Linkname by symbol name
statement: Linkname compatibility between graalgo-compiled runtime and stdlib SHALL be by symbol name, not gc ABI; a linkname-diff step SHALL scope per-release churn of the ~52+~100 edges.
rationale: graalgo compiles both sides, so only names must match; the tax is churn, paid via tooling.
