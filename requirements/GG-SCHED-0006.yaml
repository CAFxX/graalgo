id: GG-SCHED-0006
title: Scheduler-aware blocking; slot and carrier accounting around blocking host calls
statement: All blocking in the runtime and its intrinsics (including patched stdlib code) SHALL go through scheduler-aware parks (channel, select, timer/sleep, semaphore, scheduler-token sleep, poller park); raw Java blocking that bypasses the scheduler (e.g. CountDownLatch.await()) is banned there. A goroutine entering a host or foreign call that may block (every syscall role-table entry marked may-block, and any other blocking host call) SHALL release its in-flight slot (ioEnter) and re-acquire it via wakeFifo (ioExit), and the pinned carrier SHALL be off-pool or counted in the +k budget (GG-0057), so that N such goroutines at cap=N never starve a runnable goroutine. Re-entrant ioEnter, ioExit without ioEnter, and goroutine exit inside the bracket SHALL fail fast. internal/poll readiness waits (runtime_pollWait) SHALL park in the epoll poller (GG-0063), holding neither slot nor carrier.
rationale: 'Re-issue of GG-SCHED-0005 from the independent review of 2026-11-18. GG-SCHED-0005 claimed the mechanism was unchanged from the NIO era; it is not: a virtual thread blocked in NIO unmounted from its carrier, while a goroutine in a Panama downcall pins its carrier for the whole call (SPEC 3.5 ''cgo / pinning'', 3.7; abi-spike 2.5), so releasing the slot alone leaves N blocked goroutines holding N carriers at cap=N. The carrier side (off-pool or +k budget, GG-0057) is therefore part of the obligation; semaphore parks were missing from the list; only an unpaired ioEnter was asserted. Readiness waits never enter a blocking downcall: they park in the poller. Its verification plan cited the NIO-era Spike 2b F5 and a manual audit. ADR-0011 decision 3, re-issued per ADR-0012.'
parent: GG-0017
status: draft
superseded_by: ""
verification_plan: 'CapExhaustion falsifier on real pinned downcalls: N goroutines blocked in a may-block downcall (read(2) on a pipe nobody writes; a blocking regular-file read) with carriers = cap = N, plus one runnable goroutine that must complete within a bound - red with the slot release or the carrier accounting removed, green with both; the mechanical role-table gate (toolexec-design R15''s table-vs-source gate, extended to the may-block bit): every entry marked may-block dispatches through the bracket, and a seeded unbracketed may-block entry fails the gate; fail-fast tests for re-entrant ioEnter, ioExit without ioEnter and goroutine exit inside the bracket; a goroutine parked in runtime_pollWait at cap=1 holds neither slot nor carrier (a runnable goroutine progresses); the banned-blocking gate over the runtime; Phase-2 fault-injection suite.'
history:
    - '2026-11-18: created (draft), supersedes GG-SCHED-0005'
