id: GG-0033
title: Versioned exclusion list
statement: Backend-specific test exclusions SHALL live in a versioned, reason-coded list (backend-specific / unspecified-behavior / deferred-parity); the list SHALL grow only through per-release review; a shrinking list is the health metric.
rationale: Exclusions are expected; silent growth is how toil becomes unbounded.
