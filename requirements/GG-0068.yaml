id: GG-0068
title: 'GODEBUG: gc-compatible parsing; unsupported knobs fail only when in effect'
statement: Every GODEBUG setting defined by the tracked release SHALL be classified per release (emulated / no-op / unsupported with justification) in a versioned registry, and the registry SHALL be reviewed per release. In the GODEBUG environment variable (at startup and on later updates), a key the tracked release does not define, a field without "=", and a value gc cannot parse SHALL be ignored silently as under gc; //go:debug and go.mod godebug validation is cmd/go's, unchanged. graalgo SHALL fail at startup (exit status 2, message naming the knob) only when the effective value of a knob classified unsupported, from any source (the GODEBUG environment variable, //go:debug directives, go.mod godebug lines, or the default implied by the main module's go version), differs from the tracked release's default; and SHALL reproduce gc's own fatal errors (a removed knob set to an old value; cgocheck greater than 1) with gc's message and exit status.
rationale: Re-issue of GG-0065 from the independent review of 2026-11-18. GG-0065 said unknown keys are ignored but left bare fields and unparsable values undefined, said nothing of //go:debug and go.mod sources, and rejected 'a non-default value' rather than the effective value, so an unsupported knob made non-default by //go:debug or the go-version default escaped it. gc (runtime/runtime1.go parsegodebug) skips fields without '=' and values strconv cannot parse, and processes later os.Setenv updates incrementally with neither the removed-knob nor the cgocheck fatal; at startup a removed knob set to an old value is a fatal error (exit 2, 'removed GODEBUG "x509sha1" set to old value "1" in environment'), and cgocheck=2 throws (exit 2). cmd/go (modload.CheckGodebug) rejects unknown and removed-old //go:debug and go.mod keys at build time; that stays cmd/go's. ADR-0011 decision 1, re-issued per ADR-0012.
parent: ""
status: locked
superseded_by: ""
verification_plan: 'Differential tests vs gc (same stdout, normalized stderr, exit status) for: GODEBUG with an unknown key and a near-miss of a real knob; a bare field without ''=''; an unparsable value of a known knob (panicnil=abc); a removed knob set to an old value (x509sha1=1, asynctimerchan=2: gc''s fatal error, exit 2) and to a non-old value (x509sha1=0: runs); cgocheck=2 (gc''s fatal error, exit 2); os.Setenv("GODEBUG", ...) at run time carrying unknown, bare, unparsable, removed-old and cgocheck=2 fields (all ignored, as under gc); a //go:debug directive and a go.mod godebug line with an unknown key (cmd/go''s build error, exit 1, unchanged); an unsupported knob at its default (runs) and at a non-default value through each source - environment, //go:debug, go.mod godebug, go-version default (fails at startup, exit 2, message naming the knob). Registry review record per release (godebug-diff).'
