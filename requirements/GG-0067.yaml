id: GG-0067
title: 'Panic/defer/Goexit model: open-coded defers with explicit-chain fallback'
statement: 'defer, panic, recover and runtime.Goexit SHALL have exactly the semantics of the Go specification as implemented by gc: deferred calls run last-in-first-out with callee and arguments evaluated at the defer statement; recover returns the panic value only when called directly by a deferred function while panicking; deferred functions can modify named results; a panic raised by a deferred call replaces or chains the current one as in gc; runtime.Goexit runs all pending deferred calls and cannot be recovered; and runtime.Caller/Callers/Stack report the same logical frames through deferred calls, recovery and unwinding as gc. panic SHALL be an AbstractTruffleException carrying the value (lazy traces); runtime.Goexit SHALL be a ControlFlowException; panic(nil) SHALL produce *PanicNilError. Defers SHALL be implemented open-coded for the common case: when every defer statement of a function is outside any loop and the function is within the open-coded limit, its defers SHALL be lowered statically into the function (frame slots plus a defer-bits word, run at function exit with no per-call chain allocation); otherwise (a defer in a loop, over the limit, or not statically lowerable) the function''s defers SHALL use the explicit per-goroutine defer chain, so that one function never mixes the two orders. The chain SHALL also be the unwinding path for panic, recover and Goexit. Open-coding SHALL NOT be observable: both paths SHALL satisfy every obligation above.'
rationale: 'A8 (ADR-0012) accepted 2026-11-18: gc has open-coded defers since Go 1.14, and a per-goroutine ArrayDeque on every deferring call costs an allocation and a G access that compiled Go should not pay (truffle-design H15, T7). The original GG-0019 pinned the explicit chain and deferred open-coding; this keeps every semantic obligation, adds runtime.Caller and the recover/Goexit/panic-in-defer rules as explicit obligations, and keeps the chain as the fallback and unwinding path. The rejected ControlFlowException-for-panic alternative is unchanged.'
parent: ""
status: superseded
superseded_by: GG-0070
verification_plan: Defer/panic/recover/Goexit differential conformance vs gc, including adversarial defer storms, recover eligibility, panic in deferred calls, Goexit with pending defers and runtime.Caller inside deferred calls; every program runs on both paths (open-coded, and a test-only switch forcing every defer onto the chain) with identical output, so the open-coded path and the fallback are each demonstrably able to fail; plus a PE test that a function without defer or with open-coded defers has no G access and no chain allocation.
