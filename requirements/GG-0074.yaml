verification_plan: 'Spawn-time flatness (benchmark tier, a wall-clock check, never per push): test/bench/scaling/spawn_flat.go through make bench-spawn-flat, weekly in ci.yml''s full-suite job - 20,000 goroutines spawned in batches of 1,000 and kept parked; the fastest of the last two batches (19,000 alive) within 3x of the fastest of the first two (or under 50 ms a batch), output equal to gc. Per push: test/m1r/programs/spawn_parked.go (make test-m1r, carrier mode: 20,000 goroutines parked at once, output equal to gc); graalgo.sched.CarriersTest (fast Java list): no polyglot thread per goroutine, pinned-park and blocking-syscall carrier compensation, teardown; make test-goroutine-modes: the scheduler suites (LifecycleTest, ChannelTest, WakeupRaceStressTest, JfrEventsTest) and goroutine programs in the opt-in thread mode, carrier-migration programs under -ea, and cancellation in both modes. Planned: a JVM without the jdk.internal.vm export fails at scheduler creation (SchedulerCore''s constructor check, no test yet). make bench-goroutines (benchmark, not a gate): table of spawn time and idle bytes per goroutine at 10^4/10^5/10^6 against gc; per-parked-goroutine memory at 10^5 at most 2x gc''s. Spike 2b F1-F6 and the preemption-torture battery in both modes; the m1a corpus in carrier mode; pinning audit.'
history:
    - '2026-11-25: created (draft), supersedes GG-0073'
    - '2026-11-25: locked by the coordinator (global review round 4): GG-0073''s text reissued to match the implemented design - pinned parks occupy a carrier and a spare compensates; thread mode is an explicit opt-in; carrier mode without Continuation fails loudly; native-image goroutines unsupported (planned, P-F)'
    - '2026-11-25: activated (implementation started): the implementation already exists (GG-0073''s); the verification plan moves the spawn-scaling check to make bench-spawn-flat and test/m1r/programs/spawn_parked.go'
