id: GG-0074
title: Goroutines as continuations on scheduler carriers with user-space scheduler
statement: 'Each goroutine SHALL be a lightweight execution context plus a scheduler token. In the default mode (carrier mode) a goroutine SHALL be a jdk.internal.vm.Continuation run by the scheduler''s own carrier pool (a small pool of platform polyglot threads), such that the cost of creating a goroutine does not depend on the number of live goroutines and the memory held per parked goroutine is at most about twice gc''s; a parked goroutine SHALL be unmounted from every carrier thread, except a park that cannot yield because the goroutine is pinned (a monitor or native frame on its stack, or a scheduler-pinned region such as an ioEnter/ioExit bracket), which SHALL occupy its carrier and be compensated as below. One Java virtual thread per goroutine (thread mode) SHALL be selected only by explicit opt-in (-Dgraalgo.sched.goroutines=thread or the context option go.GoroutineThreads=thread), never automatically: carrier mode on a JVM where Continuation is unavailable (jdk.internal.vm not exported to the runtime) SHALL fail loudly at scheduler creation. Goroutine identity and goroutine-local state SHALL live in the per-goroutine G, never in the identity or the host thread-locals of the carrying thread. The Truffle AST SHALL insert Safepoint.poll() at loop back-edges and function entries for quantum-based preemption (indefinite park + resume token on expiry), with the same observable preemption in either mode; the carrier pool and, in thread mode, the Loom ForkJoinPool SHALL be treated as untrusted executors with no scheduling discipline assumed (the scheduler alone decides admission); GOMAXPROCS SHALL map to the scheduler in-flight cap; a goroutine SHALL block only through scheduler-aware primitives (a scheduler park, or a blocking host call bracketed by the slot-releasing path of GG-SCHED-0006), never an unaccounted raw Java blocking call, and a carrier held by a pinned park or a blocking host call SHALL be compensated by a spare carrier so that runnable goroutines are never starved of carriers.'
rationale: 'Reissues GG-0073 (2026-11-25, global review round 4), whose text had drifted from the implemented and intended design: it required a parked goroutine to be unmounted from every OS thread, but a pinned park (a monitor or native frame, or the ioEnter/ioExit bracket that keeps thread-confined native memory on its carrier) blocks its carrier while a spare carrier compensates; it kept one virtual thread per goroutine as a fallback where Continuation is unavailable, but carrier mode without Continuation fails loudly and thread mode is only an explicit opt-in; and its rationale said native images use that fallback, but nothing selects a mode for images. Every other obligation is unchanged. GG-0073 had superseded GG-0017, whose clause ''each goroutine SHALL map 1:1 to a Java virtual thread'' makes goroutine creation O(live goroutines) on Truffle 25: every goroutine is a polyglot thread, and TruffleThreadBuilder.build() runs PolyglotContextImpl.checkAllThreadAccesses, a loop over every registered thread (10^5 goroutines took 162 s to spawn, gc 0.18 s), which is incompatible with the north star (large I/O-bound servers with huge goroutine counts). ADR-0018 carrier mode measured spawn 1.0-1.5 s at 10^5 and 11.5 s at 10^6, flat in the live count, and ~2.3 KB heap per parked goroutine (gc ~2.75 KB). Known limitation (SPEC 3.5, part of the [OPEN] native-image item): goroutines in a native image are unsupported (planned) - whether jdk.internal.vm.Continuation, and the --add-exports java.base/jdk.internal.vm=ALL-UNNAMED it needs on HotSpot, work in an image is unverified, and no goroutine mode is selected for images, until truffle-design P-F verifies it, before the AOT and hybrid modes ship. GG-0006, GG-0049 and GG-0050 are unchanged.'
