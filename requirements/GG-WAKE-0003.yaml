id: GG-WAKE-0003
title: Wake and init priority lanes
statement: Woken and channel-ready goroutines SHALL be admitted via the wakeFifo priority lane ahead of runFifo (Go runnext analog); newly created goroutines SHALL be admitted via the initFifo lane ahead of runFifo.
rationale: 'Spike 2b §3.2: without initFifo, 2,768/10,000 new goroutines starved; wakeFifo preserves Go''s runnext latency behavior.'
parent: "GG-0017"
status: locked
