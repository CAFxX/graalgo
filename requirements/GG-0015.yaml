id: GG-0015
title: Java-object value model
statement: 'Go values SHALL live as Java objects: descriptor-based structs (long[]+Object[]), typed-array-backed slices, (itab,data) interfaces, byte[] strings; a Go pointer SHALL be an opaque Java reference with no observable address.'
rationale: GC integration (exact roots, free write barriers), PE/escape-analysis visibility, closed-world compatibility.
