id: GG-0017
title: Goroutines on virtual threads with user-space scheduler
statement: 'Each goroutine SHALL map 1:1 to a Java virtual thread plus a scheduler token; the Truffle AST SHALL insert Safepoint.poll() at loop back-edges and function entries for quantum-based preemption (indefinite park + resume token on expiry); the Loom ForkJoinPool SHALL be treated as an untrusted thread pool with no scheduling discipline assumed; GOMAXPROCS SHALL map to the scheduler in-flight cap.'
rationale: 'Spike 2 (yield-to-FJP) falsified FJP fairness; spike 2b validated the user-space scheduler (option C).'
