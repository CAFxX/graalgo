id: GG-0070
title: Panic/defer/recover/Goexit semantics and caller frames exactly as gc
statement: 'defer, panic, recover and runtime.Goexit SHALL behave exactly as under gc for the tracked release: deferred calls run last-in-first-out with callee and arguments evaluated at the defer statement; recover returns the panic value only when called directly by a deferred function while panicking; deferred functions can modify named results; a panic raised while a deferred call runs replaces or chains the current one as in gc; runtime.Goexit runs all pending deferred calls and cannot be recovered; panic(nil) yields *runtime.PanicNilError, except under GODEBUG panicnil=1 (the default for main modules whose go line is older than 1.21), where it panics with a nil value as gc does. runtime.Caller, runtime.Callers and runtime.CallersFrames SHALL report the same sequence of (function, file, line) as gc for all non-runtime frames, plus runtime.gopanic and the other boundary runtime frames where gc reports them (by function name); runtime.Stack, runtime/debug.Stack and the fatal-panic traceback SHALL match gc''s after the normalization defined in docs/arch/traceback-normalization.md, with gc''s exit status.'
rationale: 'Re-issue of GG-0067 (semantics half) from the independent review of 2026-11-18, which split GG-0067 into this observable contract and the mechanism requirement GG-0071. GG-0067 omitted panicnil and required ''the same logical frames'' for runtime.Caller/Callers/Stack without saying what is compared: gc reports runtime frames (runtime.gopanic at runtime/panic.go:859 between a deferred call and the panicking frame; runtime.Goexit; runtime.main; runtime.goexit) whose files and lines graalgo''s runtime cannot reproduce. docs/arch/traceback-normalization.md defines the comparison from a gc go1.27.1 probe.'
parent: ""
status: locked
superseded_by: ""
verification_plan: Differential conformance vs gc (stdout, normalized stderr, exit status) over the defer/panic/recover/Goexit corpus, including adversarial defer storms, recover eligibility (direct and indirect calls, outside a panic), named-result modification, panics in deferred calls (replace, [recovered] chains), Goexit with pending defers and on the main goroutine, panic(nil) with go.mod go 1.20 and go 1.21 and with GODEBUG=panicnil=0/1; programs printing runtime.Callers/CallersFrames and runtime.Caller(0..3) inside deferred calls at normal exit, while panicking, after recovery and during Goexit, and runtime.Stack/debug.Stack output, compared under the normalization document; each normalization rule has a negative test (a seeded wrong function, file or line of a non-runtime frame, a missing runtime.gopanic frame, a wrong [recovered] marker or exit status each fails the comparison).
