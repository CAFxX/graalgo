verification_plan: 'Spawn-time flatness: test/m1r/carrier/spawn_flat.go through test/m1r/carrier_mode.sh (make test-m1r) - 20,000 goroutines spawned in batches of 1,000 and kept parked; the fastest of the last two batches (19,000 alive) within 3x of the fastest of the first two (or under 50 ms a batch), output equal to gc. graalgo.sched.CarriersTest (fast Java list): no polyglot thread per goroutine, pinned-park and blocking-syscall carrier compensation, teardown, and the LifecycleTest and WakeupRaceStressTest suites in carrier mode. make bench-goroutines (benchmark, not a gate): table of spawn time and idle bytes per goroutine at 10^4/10^5/10^6 against gc; per-parked-goroutine memory at 10^5 at most 2x gc''s. Spike 2b F1-F6 and the preemption-torture battery in both modes; the m1a corpus in carrier mode; pinning audit. The fallback mode keeps the existing scheduler suites (SchedulerCoreTest, LifecycleTest, the GG-SCHED/GG-WAKE/GG-FAIR tests).'
