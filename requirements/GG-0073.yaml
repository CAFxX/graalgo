id: GG-0073
title: Goroutines as continuations on scheduler carriers with user-space scheduler
statement: Each goroutine SHALL be a lightweight execution context, unmounted from every OS thread while parked, plus a scheduler token. In the default mode a goroutine SHALL be a jdk.internal.vm.Continuation run by the scheduler's carrier threads (a small pool of platform polyglot threads), such that the cost of creating a goroutine does not depend on the number of live goroutines and the memory held per parked goroutine is at most about twice gc's; one Java virtual thread per goroutine SHALL remain only as a documented fallback mode where Continuation is unavailable. Goroutine identity and goroutine-local state SHALL live in the per-goroutine G, never in the identity or the host thread-locals of the carrying thread. The Truffle AST SHALL insert Safepoint.poll() at loop back-edges and function entries for quantum-based preemption (indefinite park + resume token on expiry), with the same observable preemption in either mode; the Loom ForkJoinPool and the carrier pool SHALL be treated as untrusted executors with no scheduling discipline assumed (the scheduler alone decides admission); GOMAXPROCS SHALL map to the scheduler in-flight cap; a goroutine SHALL block only through scheduler-aware primitives (a scheduler park, or a blocking host call bracketed by the slot-releasing path of GG-SCHED-0006), never an unaccounted raw Java blocking call, and a carrier held by a pinned park or a blocking host call SHALL be compensated so that runnable goroutines are never starved of carriers.
rationale: 'Supersedes GG-0017, whose clause ''each goroutine SHALL map 1:1 to a Java virtual thread'' makes goroutine creation O(live goroutines) on Truffle 25: every goroutine is a polyglot thread, and TruffleThreadBuilder.build() runs PolyglotContextImpl.checkAllThreadAccesses, a loop over every registered thread (10^5 goroutines took 162 s to spawn, gc 0.18 s), which is incompatible with the north star (large I/O-bound servers with huge goroutine counts). ADR-0018 carrier mode measured spawn 1.0-1.5 s at 10^5 and 11.5 s at 10^6, flat in the live count, and ~2.3 KB heap per parked goroutine (gc ~2.75 KB). Every other GG-0017 obligation is kept unchanged. Known limitation (SPEC 3.5, part of the [OPEN] native-image item): whether jdk.internal.vm.Continuation, and the --add-exports java.base/jdk.internal.vm=ALL-UNNAMED it needs on HotSpot, work in a native image is unverified; images use the fallback mode until truffle-design P-F verifies it, before the AOT and hybrid modes ship. GG-0006, GG-0049 and GG-0050 are unchanged.'
