id: GG-0071
title: 'Defer mechanism: open-coded up to a fixed limit, per-goroutine chain otherwise'
statement: 'panic SHALL be an AbstractTruffleException carrying the value (guest stack attached lazily) and runtime.Goexit a ControlFlowException. A function whose defer statements are all outside loops and range-over-func bodies and number at most L (L fixed in the node package, pinned by a boundary test) SHALL be open-coded (callee and arguments in frame slots plus a defer-bits word, run at function exit); all other deferring functions SHALL use the per-goroutine defer chain; the two SHALL never be mixed within one function. On panic or Goexit each frame SHALL run its own pending defers last-in-first-out, with one per-goroutine panic state (current panic, recovered flag, Goexit flag) governing recover and nested panics. A function with no defers or only open-coded defers SHALL perform no access to the goroutine object G and no allocation on the non-panic path. Which path a function takes SHALL NOT be observable: GG-0070 holds on both.'
rationale: 'Mechanism half of the GG-0067 split (independent review of 2026-11-18; A8 accepted in ADR-0012). L is the maximum number of defer statements in an open-coded function. gc open-codes a function with at most 8 defers, none in a loop or a range-over-func body, returns x defers at most 15, no heap-allocated results, and not under -race or -N (cmd/compile walk/stmt.go maxOpenDefers, ssagen/ssa.go). graalgo''s L may differ, and needs no returns x defers bound because the root has one shared exit sequence: the gc probe in docs/arch/traceback-normalization.md shows the choice unobservable (at normal exit both paths report identical frames; on the panic path both insert runtime.gopanic), so L is a performance parameter. GG-0067 also said ''the chain SHALL also be the unwinding path'', which contradicts truffle-design 4.5: an open-coded frame''s own handler runs its pending defers; the chain holds only chained frames'' records. The defers-bits word bounds L at 32.'
parent: GG-0070
status: draft
superseded_by: ""
verification_plan: Boundary tests at L and L+1 defer statements, a defer inside a loop and a defer inside a range-over-func body, each asserting which path the function's root took (a node-package introspection hook) and running the same defer/panic/recover/Goexit program on both sides of the boundary with identical output; the GG-0070 corpus run twice (default, and a test-only switch forcing every function onto the chain) with identical output; no root both open-codes and appends to the chain; a compiled-graph test that a function with no or only open-coded defers has no G access and no allocation on the non-panic path (red when the chain is forced); panic and Goexit unwinding through alternating open-coded and chained frames run every pending defer exactly once, in LIFO order.
