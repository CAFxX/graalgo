id: GG-0034
title: Mutation-validated oracles
statement: 'Every oracle layer SHALL be validated by mutation: deliberately break the lowering and confirm the harness goes red; no test SHALL be tautological (red-green evidence required).'
rationale: A harness never seen failing is not evidence.
