id: GG-0060
title: Mode selection
statement: Users SHALL select the execution mode via build flags/environment with documented defaults (default = hybrid once the hybrid meta-gate passes; JIT-only before that); mode selection SHALL NOT change program semantics.
rationale: The modes are packaging; semantics must be mode-independent.
