id: GG-0019
title: Panic/defer/Goexit model
statement: panic SHALL be an AbstractTruffleException carrying the value (lazy traces); runtime.Goexit SHALL be a ControlFlowException; defer SHALL be an explicit per-goroutine chain; panic(nil) SHALL produce *PanicNilError.
rationale: Pins the control-flow design, including the rejected ControlFlowException-for-panic alternative.
