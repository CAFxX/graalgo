id: GG-0030
title: Differential oracle definition
statement: The differential-vs-gc oracle SHALL compare stdout/stderr (normalized), exit codes, panic messages/traces modulo addresses, and sandboxed file/network effects; it SHALL exclude timings, absolute addresses, GC statistics, and raw scheduling.
rationale: Pins the oracle's compared/excluded sets so divergences are meaningful.
parent: ""
status: locked
superseded_by: ""
verification_plan: Oracle spec tests including normalization unit tests.
