id: GG-0016
title: unsafe.Pointer v1 semantics
statement: In v1, `unsafe.Pointer` SHALL be emulated via a handle table (object identity + field offset); arithmetic escaping the object SHALL trap; this restriction SHALL be documented, never silent.
rationale: Closes Phase-0 question 3; raw addresses do not exist in the value model.
