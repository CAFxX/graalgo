id: GG-0031
title: Nondeterminism controls
statement: The harness SHALL tame nondeterminism via GOMAXPROCS=1 for the scheduling-sensitive subset, multiset comparison for order-unspecified outputs, repeat runs (3-5) to classify flakes, fixed seeds, and synctest preference in new tests.
rationale: Without these, the oracle drowns in flakes.
