id: GG-0013
title: No language pinning
statement: graalgo SHALL support older language versions via per-file/per-module `-lang` gates only; it SHALL NOT pin the frontend below the vendored stdlib's language version.
rationale: 'Pinning breaks when the stdlib itself uses newer language features (go1.27 precedent: generic methods in math/rand/v2).'
parent: ""
status: active
superseded_by: ""
verification_plan: -lang regression suite across language versions.
